name: QA and publish

# DEEPDIG is plain static files, so publishing means handing a folder to Pages.
# GitHub Pages has two sources and a repository can only select one, so this
# workflow asks which one is configured and publishes the way that source reads:
#
#   build_type=workflow -> the artifact path (upload-pages-artifact + deploy-pages)
#   build_type=legacy   -> the mirror path (this run writes the `gh-pages` branch)
#
# If Pages is switched off entirely, the mirror is still written and the run
# says so in its summary instead of failing.  No build step, no bundler, no
# dependencies.

on:
  push:
    branches: ["arena/01a0ba7c-aitest", "main"]
  workflow_dispatch:

permissions:
  contents: write      # the gh-pages mirror pushes the built site
  pages: write         # publishing through the Pages API
  id-token: write      # deploy-pages signs its request with OIDC

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  qa:
    name: QA suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: bash tools/test.sh
        run: bash tools/test.sh

  publish:
    name: Publish to GitHub Pages
    needs: qa
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.pages.outputs.base_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stage exactly what a browser needs
        run: |
          set -eu
          mkdir -p _site
          for f in index.html style.css sw.js manifest.webmanifest .nojekyll \
                   icon-192.png icon-512.png apple-touch-icon.png favicon-32.png; do
            if [ ! -f "$f" ]; then echo "::error file=$f::the site is missing $f"; exit 1; fi
            cp "$f" _site/
          done
          cp -r js assets _site/
          # the offline shell has to reach the deployed site too
          test -f _site/sw.js
          # the QA harness, the art forge and the screenshots stay in the repo
          du -sh _site
          find _site -type f | wc -l

      - name: Which source does this repository publish from?
        id: source
        run: |
          set +e
          body=$(curl -sS \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          type=$(printf '%s' "$body" | python3 -c \
            'import json,sys;print(json.load(sys.stdin).get("build_type",""))' 2>/dev/null)
          echo "build_type=${type:-unknown}"
          echo "type=${type:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        id: pages
        if: steps.source.outputs.type == 'workflow'
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the artifact
        id: upload
        if: steps.source.outputs.type == 'workflow' && steps.pages.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy through the Pages API
        id: deployment
        if: steps.upload.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Mirror the same folder to gh-pages
        id: mirror
        continue-on-error: true
        run: |
          set -eu
          cd _site
          git init -q -b gh-pages .
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "publish $(echo "$GITHUB_SHA" | cut -c1-7)"
          git push -q --force \
            "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
          echo "gh-pages now carries $(git rev-parse --short HEAD)"

      - name: Ask Pages to rebuild the branch
        if: steps.source.outputs.type == 'legacy'
        continue-on-error: true
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" | head -c 400

      - name: Report
        run: |
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          {
            echo "## DEEPDIG — publish report"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Pages source configured | \`${{ steps.source.outputs.type }}\` |"
            echo "| Pages API deploy | ${{ steps.deployment.conclusion || 'not used' }} |"
            echo "| \`gh-pages\` mirror | ${{ steps.mirror.conclusion }} |"
            echo ""
            if [ "${{ steps.deployment.conclusion }}" = "success" ]; then
              echo "**The game is live at <$URL>**"
            elif [ "${{ steps.source.outputs.type }}" = "legacy" ] && [ "${{ steps.mirror.conclusion }}" = "success" ]; then
              echo "**The game is live at <$URL>** (built from the \`gh-pages\` branch)"
            else
              echo "### One switch left"
              echo ""
              echo "GitHub Pages has never been switched on for this repository, and"
              echo "that is a settings change only the owner can make. Everything else"
              echo "is done: this run already wrote the whole site to the \`gh-pages\`"
              echo "branch, and every push keeps it current."
              echo ""
              echo "Pick either source at"
              echo "<https://github.com/${{ github.repository }}/settings/pages>:"
              echo ""
              echo "1. **Source: Deploy from a branch** → branch \`gh-pages\`, folder \`/\`"
              echo "   — the site builds immediately, nothing else to do; or"
              echo "2. **Source: GitHub Actions** — then re-run this workflow (or push)"
              echo "   and the artifact path publishes."
              echo ""
              echo "Either way the game lands at <$URL>."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.deployment.conclusion }}" != "success" ] && [ "${{ steps.source.outputs.type }}" != "legacy" ]; then
            echo "::warning title=GitHub Pages is off::Enable Settings → Pages for ${{ github.repository }} (branch gh-pages, or GitHub Actions), then re-run."
          fi

      - name: Did anything publish?
        if: steps.deployment.conclusion != 'success' && steps.mirror.conclusion != 'success'
        run: |
          echo "::error title=Nothing published::both publishing paths failed"
          exit 1
